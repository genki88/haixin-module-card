<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>區域獲利模組卡 v2 · 台灣／大陸雙軌｜海欣大中華 2027 方針三</title>
<style>
:root{
  --paper:#F5F3EE; --card:#FFFFFF; --ink:#1B1A17; --muted:#6E6A61; --faint:#9A958A;
  --line:#E3DFD6; --line2:#CFC9BC;
  --accent:#0E5A54; --accent2:#E7F0EE; --accent3:#0A403C;
  --cn:#8A4B2A; --cn2:#F6EDE6; --cn3:#6B3A20;
  --warn:#B4761E; --warn2:#FBF1E0;
  --bad:#A33B2E; --bad2:#F8EBE8;
  --ok:#2F7A4F; --ok2:#E9F3ED;
  --r:10px;
}
body.cn{--accent:var(--cn);--accent2:var(--cn2);--accent3:var(--cn3)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.3;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:50;background:rgba(245,243,238,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:13px 26px 0}
.brandrow{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:24px;height:23px;display:block}
.brandrow h1{font-size:18px}
.brandrow .sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line2);color:var(--muted);background:#fff}
.regsw{margin-left:auto;display:flex;gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#fff}
.regsw button{appearance:none;border:0;background:transparent;font:inherit;font-size:13.5px;
  padding:8px 18px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:7px}
.regsw button b{font-size:14px}
.regsw button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.regsw button:not([aria-pressed="true"]):hover{background:#EDEAE3}
nav.tabs{display:flex;gap:2px;margin-top:11px;overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:transparent;font:inherit;font-size:13.5px;
  padding:9px 14px 11px;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;border-radius:6px 6px 0 0}
nav.tabs button:hover{color:var(--ink);background:#EDEAE3}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:24px 26px 90px}
.lead{max-width:820px;color:var(--muted);font-size:14px;margin:0 0 20px}
.lead b{color:var(--ink)}
h2.sec{font-size:15px;letter-spacing:.4px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
h2.sec:first-of-type{margin-top:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px}
.grid{display:grid;gap:14px}
.note{font-size:12.5px;color:var(--faint);line-height:1.65}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2.5px 8px;border-radius:5px;font-weight:600}
.tag.a{background:var(--accent2);color:var(--accent3)}
.tag.w{background:var(--warn2);color:var(--warn)}
.tag.b{background:var(--bad2);color:var(--bad)}
.tag.o{background:var(--ok2);color:var(--ok)}
.tag.n{background:#EDEAE3;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{border-top:1.5px solid var(--line2);border-bottom:0;font-weight:700}
.btn{appearance:none;font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;
  border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent3);color:#fff}
.btn.sm{font-size:12px;padding:5px 10px}

/* 卡面 */
.cardstage{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;align-items:start}
.mcard{background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.03),0 12px 30px -22px rgba(0,0,0,.5);max-width:450px}
.mcard .hd{background:var(--accent);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;gap:10px}
.mcard .hd .t1{font-size:10.5px;opacity:.72;letter-spacing:1.3px}
.mcard .hd h3{font-size:17px;margin-top:2px}
.mcard .hd .code{font-size:10.5px;opacity:.85;text-align:right;line-height:1.55;font-variant-numeric:tabular-nums}
.mcard .body{padding:14px 16px 16px}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:13px}
.kpi3 div{background:#FCFBF9;padding:10px 7px;text-align:center}
.kpi3 .k{font-size:10.5px;color:var(--muted)}
.kpi3 .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi3 .u{font-size:10px;color:var(--faint);line-height:1.4}
.rowline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line2);font-size:13px}
.rowline:last-child{border-bottom:0}
.rowline .l{color:var(--muted)}
.rowline .r{font-variant-numeric:tabular-nums;text-align:right}
.blocklabel{font-size:11px;letter-spacing:1px;color:var(--faint);margin:12px 0 5px;font-weight:600}
.hi{background:var(--ok2);border:1px solid #C6E0D0;border-radius:7px;padding:9px 11px;margin:10px 0 2px}
.hi .t{font-size:11px;color:var(--ok);font-weight:600;letter-spacing:.5px}
.disclaim{margin-top:12px;background:#FAF8F4;border:1px dashed var(--line2);border-radius:7px;
  padding:9px 11px;font-size:11.5px;color:var(--muted);line-height:1.6}

/* 模組庫 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{appearance:none;font:inherit;font-size:12.5px;padding:5px 12px;border-radius:99px;
  border:1px solid var(--line2);background:#fff;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lib{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
.lib:hover{border-color:var(--accent);transform:translateY(-2px)}
.lib.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2)}
.lib.neg{border-left:3px solid var(--bad)}
.lib .code{font-size:10.5px;color:var(--faint);letter-spacing:.8px}
.lib h4{font-size:14.5px;margin:2px 0}
.lib .meta{font-size:12px;color:var(--muted);margin-bottom:9px;min-height:32px}
.lib .two{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:9px}
.lib .two div{flex:1}
.lib .two .k{font-size:10.5px;color:var(--muted)}
.lib .two .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:#EDEAE3;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.b{background:var(--bad)}

/* 試算 */
.calcwrap{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:20px;align-items:start}
@media(max-width:900px){.calcwrap{grid-template-columns:1fr}.cardstage{grid-template-columns:1fr}}
.slider{margin-bottom:13px}
.slider .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.slider .lab b{font-variant-numeric:tabular-nums;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.scen div{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:11px 10px;text-align:center}
.scen .k{font-size:11px;color:var(--muted)}
.scen .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.scen .u{font-size:11px;color:var(--faint)}
.scen div.mid{border-color:var(--accent);background:var(--accent2)}
.waterfall{display:flex;flex-direction:column;gap:4px}
.wf{display:grid;grid-template-columns:110px 1fr 112px;align-items:center;gap:10px;font-size:12.5px}
.wf .wl{color:var(--muted);text-align:right}
.wf .wb{height:16px;border-radius:3px;background:#EDEAE3;position:relative;overflow:hidden}
.wf .wb i{position:absolute;top:0;bottom:0;left:0;background:var(--line2)}
.wf.rev .wb i{background:var(--accent)}
.wf.rev2 .wb i{background:#7FA9A4}
.wf.prof .wb i{background:var(--ok)}
.wf.loss .wb i{background:var(--bad)}
.wf .wv{text-align:right;font-variant-numeric:tabular-nums}
.beflag{background:var(--warn2);border:1px solid #EAD4AE;border-radius:8px;padding:11px 13px;font-size:13px;margin-top:13px}

/* 校準 */
.diff td.up{color:var(--bad);font-weight:600}
.diff td.dn{color:var(--ok);font-weight:600}
.timeline{display:flex;margin:16px 0 6px;overflow-x:auto;padding-bottom:6px}
.tl{flex:1;min-width:158px;border-top:2px solid var(--line2);padding:12px 14px 0;position:relative}
.tl::before{content:"";position:absolute;top:-6px;left:14px;width:10px;height:10px;border-radius:99px;background:var(--line2)}
.tl.done{border-top-color:var(--accent)}
.tl.done::before{background:var(--accent)}
.tl .q{font-size:11.5px;color:var(--faint)}
.tl .n{font-size:13.5px;font-weight:600}
.tl .d{font-size:12px;color:var(--muted)}

/* 分區 */
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.zone{border-radius:var(--r);padding:16px 18px;border:1px solid}
.zone h4{font-size:14px;margin-bottom:4px}
.zone ul{margin:8px 0 0;padding-left:17px;font-size:13px;line-height:1.85}
.zone.ai{background:var(--accent2);border-color:#BFD6D2}
body.cn .zone.ai{border-color:#E0C8B6}
.zone.hu{background:#FAF8F4;border-color:var(--line2)}
.zone.no{background:var(--bad2);border-color:#EBCCC5}
.chat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-width:760px}
.msg{margin-bottom:12px}
.msg .who{font-size:11px;color:var(--faint);margin-bottom:3px}
.msg .bub{padding:10px 13px;border-radius:9px;font-size:13.5px;line-height:1.7}
.msg.u .bub{background:#EDEAE3}
.msg.a .bub{background:var(--accent2);border:1px solid rgba(0,0,0,.06)}
.msg .cite{font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed rgba(0,0,0,.13)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}

/* 流程 */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));margin:10px 0 4px}
.fstep{position:relative;background:var(--card);border:1px solid var(--line);padding:14px 15px;margin-right:12px;border-radius:var(--r)}
.fstep:last-child{margin-right:0}
.fstep .no{font-size:10.5px;letter-spacing:1.4px;color:var(--faint)}
.fstep h4{font-size:14px;margin:2px 0 5px}
.fstep p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.fstep.human{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2)}
.fstep.blocked{border-color:var(--bad);background:#FDF7F6}
.fstep .badge{position:absolute;top:-9px;right:11px}
.loopback{margin-top:12px;border:1px dashed var(--line2);border-radius:8px;padding:10px 14px;
  font-size:12.5px;color:var(--muted);background:#FAF8F4}
.stack{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:132px 1fr;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 16px}
.srow .sl{font-size:12.5px;font-weight:600;color:var(--accent)}
.srow .sd{font-size:13px;color:var(--muted);line-height:1.7}

/* 九宮格 */
.ninegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:960px){.ninegrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.ninegrid{grid-template-columns:1fr}}
.ncell{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:border-color .15s;position:relative;display:flex;flex-direction:column}
.ncell:hover{border-color:var(--accent)}
.ncell.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent2)}
.ncell .idx{position:absolute;top:11px;right:13px;font-size:22px;font-weight:700;color:var(--line2);line-height:1}
.ncell .en{font-size:10.5px;letter-spacing:1.1px;color:var(--faint)}
.ncell h4{font-size:15px;margin:1px 0 6px}
.ncell .q{font-size:11.5px;color:var(--faint);line-height:1.6;border-top:1px solid var(--line);padding-top:7px;margin-top:auto}
.ncell .peek{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:8px}
.ndetail{margin-top:14px;background:var(--card);border:1px solid var(--accent);border-radius:var(--r);
  padding:0;overflow:hidden;box-shadow:0 0 0 2px var(--accent2)}
.ndetail .dh{background:var(--accent);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ndetail .dh h3{font-size:16px}
.ndetail .dh .qq{font-size:11.5px;opacity:.85;max-width:520px;text-align:right}
.ndetail .db{padding:16px 18px 18px}
.ndetail h5{font-size:13px;margin:0 0 6px;color:var(--accent);letter-spacing:.3px}
.ndetail p{margin:0 0 10px;font-size:13.5px;line-height:1.8}
.ndetail ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.85}
.dualcol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.dualcol{grid-template-columns:1fr}}
.dualcol .col{border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.dualcol .col.tw{background:#F2F7F6;border-color:#C8DDD9}
.dualcol .col.cn{background:#FAF3EE;border-color:#E5CFBF}
.dualcol .col h6{font-size:12.5px;margin:0 0 8px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.dualcol .col.tw h6{color:#0E5A54}
.dualcol .col.cn h6{color:#8A4B2A}
.dualcol .col ul{margin:0;padding-left:17px;font-size:13px;line-height:1.8}
.dualcol .col p{font-size:13px;line-height:1.78;margin:0 0 8px}

/* 對照 */
.cmp{width:100%;font-size:13.5px}
.cmp th:nth-child(2),.cmp td:nth-child(2){background:#F2F7F6}
.cmp th:nth-child(3),.cmp td:nth-child(3){background:#FAF3EE}
.cmp th{font-size:13px;color:var(--ink);font-weight:700;padding:10px}
.cmp td:first-child{color:var(--muted);font-size:12.5px;width:130px}
.gap{display:grid;gap:8px}
.gitem{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13.5px}
.gitem .ck{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:#fff}
.gitem.no .ck{background:#fff}
.gitem.part .ck{background:var(--warn);border-color:var(--warn)}
.gitem.yes .ck{background:var(--ok);border-color:var(--ok)}
.gitem .who{font-size:11.5px;color:var(--faint)}
.bigmsg{border:2px dashed var(--line2);border-radius:12px;padding:26px 28px;background:#FCFBF9;max-width:820px}
.bigmsg h3{font-size:17px;margin-bottom:8px}
.bigmsg p{margin:0 0 10px;font-size:14px;color:var(--muted);line-height:1.85}
.bigmsg p b{color:var(--ink)}

@media print{
  header.top{position:static;background:#fff}
  nav.tabs,.regsw{display:none}
  section[hidden]{display:block !important}
  section{page-break-before:always}
  body{background:#fff;font-size:12px}
  main{padding:10px 0 0}
  @page{size:A4;margin:12mm}
}
footer{max-width:1280px;margin:0 auto;padding:0 26px 60px;color:var(--faint);font-size:12px;line-height:1.8}
</style>

<body>

<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="mark" title="WINEX DERMA">
        <svg viewBox="-4 -2 112 104" aria-label="WINEX">
          <clipPath id="wclip"><rect x="-8" y="0" width="120" height="100"/></clipPath>
          <path clip-path="url(#wclip)" d="M4.5,-14 L37,100 L52,40 L67,100 L99.5,-14"
                fill="none" stroke="#fff" stroke-width="16" stroke-miterlimit="10"/>
        </svg>
      </div>
      <h1>區域獲利模組卡</h1>
      <span class="sub">海欣大中華 2027 · 方針三｜提案 A · v2 雙軌版</span>
      <span class="pill">示範資料 · 非核定數字</span>
      <div class="regsw" id="regsw">
        <button data-r="tw" aria-pressed="true"><b>台灣地區</b><span style="font-size:11px;opacity:.85">制度已知</span></button>
        <button data-r="cn" aria-pressed="false"><b>大陸地區</b><span style="font-size:11px;opacity:.85">建構中</span></button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main id="main"></main>

<footer id="foot"></footer>

<script>
/* ══════════════════════════════════════════════
   模型引擎
   ══════════════════════════════════════════════ */
function calcTW(p){
  // 一位票券客的實際價值（年度）＝ 補給費 ＋ 現場加購毛利 ＋ 轉正後首年貢獻
  const gm         = 1 - p.materialRate - p.bonusRate;              // 服務毛利率
  const vUpValue   = p.upRate * p.upTicket * gm;                    // 現場加購毛利
  const vConvValue = p.convRate * p.ownTicket * p.repeatPerYear * gm; // 轉正後首年貢獻
  const vUnitValue = p.subsidy + vUpValue + vConvValue;             // 每位合計
  const vFold      = vUnitValue / p.subsidy;                        // 是補給費的幾倍
  const ownRev   = p.ownVisits * p.ownTicket;
  const upRev    = p.vVisits * p.upRate * p.upTicket;
  const svcRev   = ownRev + upRev;
  const subsidy  = p.vVisits * p.subsidy;
  const goodsRev = p.redeemValue * p.sellRate;
  const rev      = svcRev + subsidy + goodsRev;
  const bonus    = svcRev * p.bonusRate;
  const material = svcRev * p.materialRate;
  const mkt      = svcRev * p.mktRate;
  const dep      = (p.deco + p.equip) / 60;
  const cost     = p.rent + p.staff + bonus + material + p.mgmtFee + mkt + p.misc + dep;
  const profit   = rev - cost;
  return {ownRev,upRev,svcRev,subsidy,goodsRev,rev,bonus,material,mkt,dep,cost,profit,
    gm,vUpValue,vConvValue,vUnitValue,vFold,
    vYearValue: vUnitValue * p.vVisits * 12,
    margin: rev? profit/rev : 0,
    mgmtReturn: goodsRev + subsidy,
    mgmtNet: p.mgmtFee - (goodsRev + subsidy),
    revItems:[{k:'自有客服務',v:ownRev},{k:'票券客加購',v:upRev},{k:'票券補給費',v:subsidy},{k:'兌貨商品銷售',v:goodsRev}],
    costItems:[{k:'租金',v:p.rent},{k:'人事（含店主）',v:p.staff},{k:'業績獎金',v:bonus},

const invNet   = c => invTotal(c) - (c.invest['保證金（待確認）']||0);
function payback(c,p){const r=calcTW(p); return r.profit>0 ? invNet(c)/r.profit : Infinity}
function breakEvenOwn(p){
  const vr = p.bonusRate + p.materialRate + p.mktRate;
  const upRev = p.vVisits*p.upRate*p.upTicket;
  const fixed = p.rent + p.staff + p.mgmtFee + p.misc + (p.deco+p.equip)/60;
  const other = p.vVisits*p.subsidy + p.redeemValue*p.sellRate + upRev*(1-vr);
  return (fixed - other) / (p.ownTicket*(1-vr));
}

  const maxPay=Math.max(...TW.map(c=>{const v=payback(c,c.p);return v===Infinity?60:v;}));
  const c=TW.find(x=>x.code===selCard)||TW[0], r=calcTW(c.p);

   <div class="filters">
     <span class="note" style="margin-right:4px">票券人口帶</span>
     <button class="chip" data-f="band" data-v="all" aria-pressed="${filt.band==='all'}">全部</button>
     <button class="chip" data-f="band" data-v="北部票券帶" aria-pressed="${filt.band==='北部票券帶'}">北部帶</button>
     <button class="chip" data-f="band" data-v="南部票券帶" aria-pressed="${filt.band==='南部票券帶'}">南部帶</button>

     <button class="chip" data-f="sort" data-v="pay" aria-pressed="${filt.sort==='pay'}">回收期最短</button>
     <button class="chip" data-f="sort" data-v="margin" aria-pressed="${filt.sort==='margin'}">淨利率最高</button>
     <button class="chip" data-f="sort" data-v="inv" aria-pressed="${filt.sort==='inv'}">投資額最低</button>
   </div>
   <div class="libgrid">
   ${list.map(x=>{const rr=calcTW(x.p), pb=payback(x,x.p), neg=rr.profit<=0;
     return `<div class="lib ${x.code===selCard?'on':''} ${neg?'neg':''}" data-c="${x.code}">
       <div class="code">${x.code} · 樣本 ${x.sample} 店</div>
       <h4>${x.name}</h4>
       <div class="meta">${x.band}｜${x.ping} 坪｜投資 ${wan(invTotal(x))}<br>票券 ${x.vYear} 位／年</div>
       <div class="two">
         <div><div class="k">月淨利率</div><div class="v" style="color:${neg?'var(--bad)':'inherit'}">${pct(rr.margin)}</div></div>
         <div><div class="k">回收期</div><div class="v" style="color:${neg?'var(--bad)':'inherit'}">${pb===Infinity?'不回收':pb.toFixed(0)+' <span style="font-size:11px;font-weight:400">月</span>'}</div></div>
       </div>
       <div class="bar"><i class="${neg?'b':''}" style="width:${pb===Infinity?100:(pb/maxPay*100).toFixed(0)}%"></i></div>
     </div>`}).join('')}
   </div>

   <h2 class="sec">北南對照：同店型、同合約等級，差在哪裡</h2>
   <div class="panel">
     <table class="cmp">
       <tr><th></th><th>T-N-01 · 北部票券帶</th><th>T-S-03 · 南部票券帶</th></tr>
       <tr><td>店型與合約</td><td>標準店 25 坪 · 加盟 60</td><td>標準店 25 坪 · 加盟 60</td></tr>
       <tr><td>票券配發</td><td><b>${n1.vYear} 位／年（約 ${n1.p.vVisits} 位／月）</b></td><td><b>${n3.vYear} 位／年（約 ${n3.p.vVisits} 位／月）</b></td></tr>
       <tr><td>月租金</td><td>${money(n1.p.rent)}</td><td>${money(n3.p.rent)}　<span class="tag o">低 ${money(n1.p.rent-n3.p.rent)}</span></td></tr>
       <tr><td>人事</td><td>${money(n1.p.staff)}</td><td>${money(n3.p.staff)}　<span class="tag o">低 ${money(n1.p.staff-n3.p.staff)}</span></td></tr>
       <tr><td>月營收</td><td>${money(r1.rev)}</td><td>${money(r3.rev)}</td></tr>
       <tr><td>月淨利</td><td><b>${money(r1.profit)}</b>（${pct(r1.margin)}）</td><td><b>${money(r3.profit)}</b>（${pct(r3.margin)}）</td></tr>
       <tr><td>開辦投資</td><td>${wan(invTotal(n1))}</td><td>${wan(invTotal(n3))}</td></tr>
       <tr class="total"><td>靜態回收期</td><td>${payback(n1,n1.p).toFixed(1)} 個月</td><td><span style="color:var(--bad)">${payback(n3,n3.p).toFixed(1)} 個月（多 ${(payback(n3,n3.p)-payback(n1,n1.p)).toFixed(1)} 月）</span></td></tr>
     </table>
     <p class="note" style="margin-top:12px">
       <b style="color:var(--ink)">這張表就是「大小眼」爭議的解法。</b>南部租金與人事都比北部低，看起來應該更好賺；但票券配發少 10 位／月，抵銷之後回收期反而多 ${(payback(n3,n3.p)-payback(n1,n1.p)).toFixed(1)} 個月。
       差異來自<b style="color:var(--ink)">地區票券購買人口</b>（【已確認】為不可改變的結構因素），不是分配決策。<br>
       卡上把這個差距如實寫出來，不藏——因應方式在自有客經營，不在爭配額。這比任何一次區域說明會都有用。</p>
   </div>

   <h2 class="sec">選定卡片：完整結構（${c.code}）</h2>
   <div class="grid" style="grid-template-columns:minmax(290px,1fr) minmax(300px,1.15fr)">
     <div class="panel"><h3 style="font-size:14px;margin-bottom:10px">開辦投資明細</h3>
       <table>
        ${Object.entries(c.invest).map(([k,v])=>`<tr><td>${k}${k.indexOf('待確認')>=0?' <span class="tag w">彙編列為缺口</span>':''}</td><td class="n">${v?money(v):'—'}</td></tr>`).join('')}
        <tr class="total"><td>開辦總投資</td><td class="n">${money(invTotal(c))}</td></tr>
       </table>
       <p class="note" style="margin-top:8px">※ 加盟金 60 萬為<b>一次性</b>，加盟後不再收取（【已確認】）。彙編指出加盟主普遍誤以為每年支付——這一列的措辭本身就是澄清工具。</p>
     </div>
     <div class="panel"><h3 style="font-size:14px;margin-bottom:10px">月損益結構（基準情境）</h3>
       <table>
        <tr><td colspan="3" style="color:var(--accent);font-weight:600;font-size:12px;border-bottom:0;padding-bottom:2px">收入</td></tr>
        ${r.revItems.map(i=>`<tr><td style="padding-left:18px;color:var(--muted)">${i.k}</td><td class="n">${money(i.v)}</td><td class="n" style="color:var(--muted)">${pct(i.v/r.rev)}</td></tr>`).join('')}
        <tr><td><b>月營收合計</b></td><td class="n"><b>${money(r.rev)}</b></td><td class="n" style="color:var(--muted)">100%</td></tr>
        <tr><td colspan="3" style="color:var(--bad);font-weight:600;font-size:12px;border-bottom:0;padding:8px 10px 2px">支出</td></tr>
        ${r.costItems.map(i=>`<tr><td style="padding-left:18px;color:var(--muted)">${i.k}</td><td class="n">(${money(i.v)})</td><td class="n" style="color:var(--muted)">${pct(i.v/r.rev)}</td></tr>`).join('')}
        <tr class="total"><td>月淨利</td><td class="n" style="color:${r.profit<0?'var(--bad)':'inherit'}">${money(r.profit)}</td><td class="n">${pct(r.margin)}</td></tr>
        <tr><td style="color:var(--muted);border-bottom:0">自有客損益兩平</td><td class="n" style="border-bottom:0" colspan="2">${Math.ceil(breakEvenOwn(c.p))} 人次／月（現況 ${c.p.ownVisits}）</td></tr>
       </table>
     </div>
   </div>`;
}

    {k:'ownVisits',label:'自有客人次／月',min:40,max:280,step:5,fmt:v=>v+' 人次'},
    {k:'ownTicket',label:'自有客單價',min:1800,max:5000,step:100,fmt:v=>money(v)},
    {k:'sellRate',label:'兌貨售出率　← 你自己能改的',min:.2,max:1,step:.05,fmt:v=>pct(v)},
    {k:'vVisits',label:'票券配額（位／月）',min:0,max:35,step:1,fmt:v=>v+' 位'},
    {k:'convRate',label:'票券客轉正率　← 你自己能改的',min:0,max:.5,step:.01,fmt:v=>pct(v)},

    hi=calcTW({...cp,ownVisits:cp.ownVisits*1.15,ownTicket:cp.ownTicket*1.05,sellRate:Math.min(1,cp.sellRate*1.15)});
  const pbs=p=> p>0? (invNet(c)/p).toFixed(0)+' 個月' : '不回收';

  const rows=[{k:'自有客服務',v:base.ownRev,cls:'rev'},{k:'票券客加購',v:base.upRev,cls:'rev2'},

         <div class="rowline"><span class="l"><b>管理費淨額（僅現金項）</b></span><span class="r"><b style="color:${base.mgmtNet<0?'var(--ok)':'var(--bad)'}">${base.mgmtNet<0?'淨回收 '+money(-base.mgmtNet):'淨支出 '+money(base.mgmtNet)}</b></span></div>
       </div>
       <div class="hi" style="margin-top:10px;background:#EDF2F7;border-color:#C3D3E0">
         <div class="t" style="color:#1F3B66">▍一位票券客的實際價值（隨轉正率即時變動）</div>
         <div class="rowline"><span class="l">補給費</span><span class="r">${money(cp.subsidy)}</span></div>
         <div class="rowline"><span class="l">現場加購毛利</span><span class="r">＋${money(base.vUpValue)}</span></div>

         <div class="rowline"><span class="l">年度導客價值（${cp.vVisits} 位／月）</span><span class="r"><b>${money(base.vYearValue)}／年</b></span></div>
       </div>

     <div>
       <div class="scen">

         <div><div class="k">樂觀</div><div class="v">${(hi.profit/10000).toFixed(1)}</div><div class="u">萬／月 · ${pbs(hi.profit)}</div></div>
       </div>
       <div class="panel">
         <h3 style="font-size:14px;margin-bottom:10px">月損益瀑布（依你調整後的參數）</h3>

         </div>
         <div class="beflag">
           <b>自有客損益兩平人次：${be>0?Math.ceil(be)+' 人次／月':'0（票券與兌貨已覆蓋固定成本）'}</b>${be>0?`　（＝你設定人次的 ${pct(be/cp.ownVisits)}）`:''}<br>
           <span style="color:var(--muted);font-size:12.5px">
           ${base.profit<0?'目前設定為<b style="color:var(--bad)">虧損</b>。':'淨利率 '+pct(base.margin)+'。'}
           ${base.mgmtNet<0?'管理費在此設定下為<b style="color:var(--ok)">淨回收</b>——兌貨賣得動，管理費就不是支出。':'管理費在此設定下為<b style="color:var(--bad)">淨支出</b>：把兌貨售出率拉到 '+pct(Math.min(1,(cp.mgmtFee-base.subsidy)/cp.redeemValue))+' 以上即可打平。'}

       </div>
       <p class="note" style="margin-top:12px">※ 折舊以裝修＋設備 5 年直線攤提計入。加盟金 60 萬為一次性支出，計入開辦投資但不計入月損益。<b>票券客補給費為店端收入（非零分潤）</b>；上方「票券客實際價值」為年度導客效益試算，未重複計入月損益，避免灌水。</p>
     </div>
   </div>`;
}

         <td class="n ${r[3]>0?(r[5]?'up':'dn'):(r[5]?'dn':'up')}">${r[3]>0?'+':''}${(r[3]*100).toFixed(1)}%</td>

       <tr class="total"><td>管理費淨額</td><td class="n">${r1.mgmtNet<0?'淨回收 '+money(-r1.mgmtNet):money(r1.mgmtNet)}</td>

       </tbody>
     </table>

   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:14px">
     <div class="panel">

function pageFlow(){

   <div class="flow">
     <div class="fstep blocked"><div class="no">STEP 01</div><h4>各店資料上傳</h4><p>大陸無在營門店回報機制，亦無回報義務條款。<b>此步驟目前不存在。</b></p><span class="badge tag b">斷點</span></div>
     <div class="fstep blocked"><div class="no">STEP 02</div><h4>去識別彙整</h4><p>無資料可彙整；且城市分級未定義，無法歸群。</p><span class="badge tag b">斷點</span></div>

     <div class="fstep human"><div class="no">STEP 04</div><h4>季度校準會議</h4><p>共用台灣軌的會議機制與人審原則。</p><span class="badge tag o">人審</span></div>
     <div class="fstep human"><div class="no">STEP 05</div><h4>財務簽核發版</h4><p>共用簽核流程；大陸卡另需財務確認幣別與換匯處理。</p><span class="badge tag o">人審</span></div>
     <div class="fstep blocked"><div class="no">STEP 06</div><h4>對外查閱</h4><p>2027 不開放。具備公開條件前，對外文件僅有授權前置卡。</p><span class="badge tag b">不開放</span></div>
   </div>
   <div class="loopback">↺ <b>結論：</b>斷點全在前兩步，而前兩步的解法是<b>合約條款</b>與<b>定義文件</b>，不是系統開發。後三步台灣軌已經有現成流程，大陸資料到位就能接上——所以 2027 大陸軌的 IT 預算建議為零。</div>
   <h2 class="sec">要接通這條管線，2027 只有三件事</h2>
   <div class="stack">
     <div class="srow"><div class="sl">第一件</div><div class="sd"><b>定義城市分級</b>（Q1）。沒有分群定義，收再多資料也無法歸群統計。純內部決策，開會即可定。</div></div>
     <div class="srow"><div class="sl">第二件</div><div class="sd"><b>把月結回報義務寫進新約範本</b>（Q2）。唯一需要對方配合、且只有簽約當下有籌碼的一件事——<b>本軌的關鍵路徑</b>。</div></div>
     <div class="srow"><div class="sl">第三件</div><div class="sd"><b>選定 1–2 個試點市場並開始回報</b>（Q3）。樣本從這裡開始累積；Q4 若某分群達 ≥3 家，第一張大陸卡才有可能誕生。</div></div>
   </div>`;
  return `
   <p class="lead">一張卡不是寫出來的，是<b>從各店真實營運資料長出來的</b>。台灣的優勢在於總部本來就握有三條資料流——<b>出貨（兌貨額度）、票券（配發與補給費）、POS（來客與客單）</b>。這條線上有兩個人審閘門，缺一個，卡就退回草稿狀態、不得公開。</p>

     <div class="fstep"><div class="no">STEP 02</div><h4>去識別彙整</h4><p>移除店名店號，僅保留合約等級／店型／票券帶／開店年資。樣本 &lt;3 店的分群不出卡。</p></div>

     <div class="fstep human"><div class="no">STEP 04</div><h4>季度校準會議</h4><p>財務主持，逐項判斷偏離原因，決議改／不改／改範圍，留存理由。</p><span class="badge tag o">人審閘門</span></div>
     <div class="fstep human"><div class="no">STEP 05</div><h4>財務簽核發版</h4><p>簽核後才生成 vN 卡片，同步發布差異表與資料期間。</p><span class="badge tag o">人審閘門</span></div>
     <div class="fstep"><div class="no">STEP 06</div><h4>對外查閱與試算</h4><p>洽談時由顧問操作試算，輸出 PDF 雙方簽名留存；查閱行為留紀錄。</p></div>
   </div>
   <div class="loopback">↺ <b>回饋迴路：</b>加盟主在試算頁填入的自有參數（租金、來客、兌貨售出率）在<b>經同意且去識別</b>的前提下回流為下一季樣本，讓卡片愈用愈準。未同意者不納入，且不影響其查閱與試算權限。</div>
   <h2 class="sec">數位化要動的系統（不必大改 ERP）</h2>

}

       <tr><td>卡片專屬欄位</td><td><b>①管理費換到什麼</b>（兌貨售出率 × 會員價 5 萬 ＋ 補給費）<br><b>②一位票券客的實際價值</b>（補給費＋加購毛利＋轉正貢獻）</td><td>不適用——大陸無票券體系、無兌貨制度</td></tr>
       <tr><td>資料流</td><td>出貨／票券／POS 三條，總部已握有</td><td>無回報機制、無義務條款（<b>斷點在第一步</b>）</td></tr>

   <h2 class="sec">本樣張與提案版的關係</h2>
   <div class="panel">

       <tr><td>【提案二】分銷網址內容月包<br>【提案三】票券跨店履約結算</td><td>本樣張<b>未涉及</b>，維持提案版原內容不動。</td></tr>

const PAGES={card:pageCard,lib:pageLib,calc:pageCalc,cal:pageCal,ai:pageAI,flow:pageFlow,nine:pageNine,cmp:pageCmp};
function render(){
  document.body.classList.toggle('cn',REGION==='cn');
  const T = REGION==='tw'?TABS_TW:TABS_CN;
  document.getElementById('tabs').innerHTML=T.map(([k,l])=>
    `<button data-t="${k}" aria-selected="${k===TAB}">${l}</button>`).join('');
  document.querySelectorAll('#regsw button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.r===REGION));
  document.getElementById('main').innerHTML=(PAGES[TAB]||pageCard)();
  document.getElementById('foot').innerHTML=
    `區域獲利模組卡 v2 · 台灣／大陸雙軌功能樣張｜海欣大中華 2027 年度方針三 · 提案 A ｜ 本樣張所有數字為<b>格式示範用假設值</b>，非核定數字、非任何形式之獲利承諾。<br>
     制度參數（加盟金 60 萬一次性／管理費 25,000／兌貨會員價 5 萬／每位引流客補給費 ≥300 元・非零分潤）取自《VIVISPA 加盟體系基礎資料彙編》標示【已確認】之項目；標【待確認】者為該文件已列明之資訊缺口。<br>
     真實卡片須以總部財務盤點之去識別群體統計為準，經財務簽核後發版。`;
  bind();
  history.replaceState(null,'','#/'+REGION+'/'+TAB);
}
function bind(){
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;window.scrollTo(0,0);render()});
  document.querySelectorAll('#regsw button').forEach(b=>b.onclick=()=>{REGION=b.dataset.r;faceBack=false;qaIdx=0;window.scrollTo(0,0);render()});
  const f=document.getElementById('flip'); if(f) f.onclick=()=>{faceBack=!faceBack;render()};
  document.querySelectorAll('.cardpick').forEach(b=>b.onclick=()=>{selCard=b.dataset.c;cp=null;render()});
  document.querySelectorAll('.lib').forEach(b=>b.onclick=()=>{selCard=b.dataset.c;cp=null;render()});
  document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{filt[b.dataset.f]=b.dataset.v;render()});
  document.querySelectorAll('.ncell').forEach(b=>b.onclick=()=>{nineSel=+b.dataset.i;render()});
  document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{qaIdx=+b.dataset.i;render()});
  const rs=document.getElementById('reset');
  if(rs) rs.onclick=()=>{cp=null;render()};
  document.querySelectorAll('#sliders input').forEach(i=>{
    i.oninput=()=>{cp[i.dataset.k]=parseFloat(i.value);render();
      const el=document.querySelector(`#sliders input[data-k="${i.dataset.k}"]`); if(el) el.focus();};
  });
}
(function(){
  const h=location.hash.replace('#/','').split('/');
  if(h[0]==='tw'||h[0]==='cn') REGION=h[0];
  if(h[1]&&PAGES[h[1]]) TAB=h[1];
  render();
})();
